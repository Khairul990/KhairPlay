<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slide Puzzle</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;background:#05070f;color:#eef2ff;font-family:"Segoe UI",system-ui,Arial,sans-serif}
.wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;padding:14px}
.hud{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pill{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);padding:7px 15px;border-radius:999px;font-size:13px;font-weight:700}
.modes{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.mode-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);color:#9aa7d0;padding:9px 16px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer}
.mode-btn.active{background:linear-gradient(135deg,#6d5dfc,#22d3ee);color:#071026;border-color:transparent}
#msg{font-size:17px;font-weight:700;min-height:26px;text-align:center}
.hint{color:#9aa7d0;font-size:13px;text-align:center;max-width:420px}
.board{display:grid;gap:8px;padding:10px;background:#0b1024;border:1px solid rgba(255,255,255,.1);border-radius:16px;touch-action:manipulation}
.tile{aspect-ratio:1;display:grid;place-items:center;border-radius:12px;font-weight:800;
  background:linear-gradient(135deg,#1b2450,#131a38);border:1px solid rgba(255,255,255,.12);
  color:#dbe4ff;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
  transition:transform .12s,background .15s;font-family:"Segoe UI",system-ui,sans-serif}
.tile:hover{background:linear-gradient(135deg,#27306a,#1a2348);transform:scale(1.03)}
.tile.blank{background:transparent;border-color:transparent;cursor:default;transform:none}
.tile.done{background:linear-gradient(135deg,#14532d,#0b3b24);border-color:#22c55e;color:#bbf7d0}
.btn{background:linear-gradient(135deg,#6d5dfc,#22d3ee);color:#071026;border:0;padding:11px 22px;border-radius:10px;font-weight:800;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="modes">
    <button class="mode-btn active" id="m3">3 x 3 Easy</button>
    <button class="mode-btn" id="m4">4 x 4 Classic</button>
  </div>
  <div class="hud">
    <div class="pill">Moves: <b id="moves">0</b></div>
    <div class="pill">Time: <b id="time">0s</b></div>
    <div class="pill">Best: <b id="best">-</b></div>
  </div>
  <div id="msg">Tile gulo soroie 1 theke serial banan!</div>
  <div class="hint">Tap kore blank er sathe lagano tile soriyan. Keyboard-e arrow key o kaj kore.</div>
  <div class="board" id="board"></div>
  <button class="btn" id="resetBtn">↻ Notun Puzzle</button>
</div>
<script>
(function(){
"use strict";
var boardEl=document.getElementById("board"),msg=document.getElementById("msg"),
    movesEl=document.getElementById("moves"),timeEl=document.getElementById("time"),bestEl=document.getElementById("best"),
    resetBtn=document.getElementById("resetBtn"),m3=document.getElementById("m3"),m4=document.getElementById("m4");
var size=3,tiles=[],moves=0,started=false,timer=null,secs=0,over=false;
var BEST_KEY="gvp_slide_best";

function bestKey(){return BEST_KEY+"_"+size;}
function loadBest(){
  var b="";
  try{b=localStorage.getItem(bestKey())||"";}catch(e){}
  bestEl.textContent=b?b+" moves":"-";
}
function saveBest(n){
  try{
    var cur=parseInt(localStorage.getItem(bestKey())||"0",10);
    if(!cur||n<cur){localStorage.setItem(bestKey(),String(n));loadBest();return true;}
  }catch(e){}
  return false;
}
function isSorted(){
  for(var i=0;i<tiles.length-1;i++){if(tiles[i]!==i+1)return false;}
  return tiles[tiles.length-1]===0;
}
function render(){
  var html="";
  for(var i=0;i<tiles.length;i++){
    var v=tiles[i];
    var cls="tile"+(v===0?" blank":(v===i+1?" done":""));
    var label=v===0?"":v;
    html+='<div class="'+cls+'" data-i="'+i+'" role="button" tabindex="0" aria-label="'+(v===0?"khali jayga":("tile "+v))+'">'+label+'</div>';
  }
  boardEl.innerHTML=html;
}
function indexOfBlank(){
  for(var i=0;i<tiles.length;i++)if(tiles[i]===0)return i;
  return -1;
}
function neighbors(i){
  var r=Math.floor(i/size),c=i%size,out=[];
  if(r>0)i-=size,out.push(i);i=r*size+c;
  if(r<size-1)i+=size,out.push(i);i=r*size+c;
  if(c>0)out.push(i-1);
  if(c<size-1)out.push(i+1);
  return out;
}
function startTimer(){
  if(started)return;
  started=true;
  timer=setInterval(function(){
    secs++;timeEl.textContent=secs+"s";
  },1000);
}
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
function tick(){
  moves++;movesEl.textContent=moves;
  startTimer();
}
function tryMove(i){
  if(over)return;
  var b=indexOfBlank();
  if(neighbors(b).indexOf(i)===-1)return;
  startTimer();
  tiles[b]=tiles[i];tiles[i]=0;
  tick();
  render();
  if(isSorted()){
    over=true;stopTimer();
    var record=saveBest(moves);
    msg.textContent=record?"🏆 Notun best! "+moves+" moves-e solve!":"🏆 Solve hoyeche! "+moves+" moves, "+secs+"s.";
    highlightAll();
  }
}
function highlightAll(){
  var cells=boardEl.querySelectorAll(".tile");
  for(var i=0;i<cells.length;i++)cells[i].classList.add("done");
}
function shuffle(){
  var blank=tiles.length-1;
  var last=-1;
  var rounds=size*size*30;
  for(var n=0;n<rounds;n++){
    var opts=neighbors(blank).filter(function(x){return x!==last;});
    if(!opts.length)opts=neighbors(blank);
    var pick=opts[Math.floor(Math.random()*opts.length)];
    tiles[blank]=tiles[pick];tiles[pick]=0;
    last=blank;blank=pick;
  }
  if(isSorted())shuffle();
}
function newGame(){
  over=false;moves=0;secs=0;started=false;stopTimer();
  movesEl.textContent="0";timeEl.textContent="0s";
  msg.textContent="Tile gulo soroie 1 theke serial banan!";
  tiles=[];
  for(var i=1;i<size*size;i++)tiles.push(i);
  tiles.push(0);
  shuffle();
  render();
  loadBest();
}
function setSize(n){
  size=n;
  m3.classList.toggle("active",n===3);
  m4.classList.toggle("active",n===4);
  boardEl.style.gridTemplateColumns="repeat("+n+", minmax(58px, 88px))";
  newGame();
}
boardEl.addEventListener("click",function(e){
  var t=e.target.closest(".tile");
  if(!t||t.classList.contains("blank"))return;
  tryMove(parseInt(t.dataset.i,10));
});
boardEl.addEventListener("keydown",function(e){
  if(e.key!=="Enter"&&e.key!==" ")return;
  var t=e.target.closest(".tile");
  if(!t||t.classList.contains("blank"))return;
  e.preventDefault();
  tryMove(parseInt(t.dataset.i,10));
});
document.addEventListener("keydown",function(e){
  if(over)return;
  var b=indexOfBlank(),r=Math.floor(b/size),c=b%size,target=-1;
  if(e.key==="ArrowUp"&&r<size-1)target=b+size;
  else if(e.key==="ArrowDown"&&r>0)target=b-size;
  else if(e.key==="ArrowLeft"&&c<size-1)target=b+1;
  else if(e.key==="ArrowRight"&&c>0)target=b-1;
  if(target>=0){e.preventDefault();tryMove(target);}
});
resetBtn.addEventListener("click",newGame);
m3.addEventListener("click",function(){setSize(3);});
m4.addEventListener("click",function(){setSize(4);});
setSize(3);
})();
</script>
</body>
</html>
