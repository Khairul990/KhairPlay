<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Snake</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#05070f;color:#eef2ff;font-family:"Segoe UI",system-ui,Arial,sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:8px}
.hud{display:flex;gap:14px;align-items:center;font-size:14px;font-weight:700;flex-wrap:wrap;justify-content:center}
.hud span{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);padding:6px 14px;border-radius:999px}
.hud .hi{color:#22d3ee}
canvas{background:#0a0f1f;border:1px solid rgba(255,255,255,.12);border-radius:12px;max-width:100%;height:auto;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.btn{background:linear-gradient(135deg,#6d5dfc,#22d3ee);color:#071026;border:0;padding:9px 20px;border-radius:10px;font-weight:800;font-size:14px;cursor:pointer}
.btn.ghost{background:rgba(255,255,255,.08);color:#eef2ff;border:1px solid rgba(255,255,255,.15)}
.overlay{position:fixed;inset:0;background:rgba(5,7,15,.88);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:20px;z-index:5}
.overlay.show{display:flex}
.overlay h2{font-size:30px}
.overlay p{color:#9aa7d0}
.hint{font-size:12px;color:#9aa7d0}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <span>Score: <b id="score">0</b></span>
    <span class="hi">Best: <b id="best">0</b></span>
    <span>Speed: <b id="speed">1</b></span>
    <button class="btn ghost" id="pauseBtn">⏸ Pause</button>
    <button class="btn" id="restartBtn">↻ Restart</button>
  </div>
  <canvas id="c" width="440" height="440"></canvas>
  <div class="hint">⬅⬆➡⬇ Arrow keys nite paren · Mobile-e swipe korun</div>
</div>

<div class="overlay" id="overlay">
  <h2 id="ovTitle">😿 Game Over</h2>
  <p id="ovMsg">Score: 0</p>
  <button class="btn" id="ovBtn">▶ Abar Kheln</button>
</div>

<script>
(function(){
"use strict";
var canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
var scoreEl=document.getElementById("score"),bestEl=document.getElementById("best"),speedEl=document.getElementById("speed");
var overlay=document.getElementById("overlay"),ovTitle=document.getElementById("ovTitle"),ovMsg=document.getElementById("ovMsg"),ovBtn=document.getElementById("ovBtn");
var pauseBtn=document.getElementById("pauseBtn"),restartBtn=document.getElementById("restartBtn");
var COLS=22,ROWS=22,CELL=Math.floor(Math.min(440/COLS,440/ROWS));
canvas.width=COLS*CELL;canvas.height=ROWS*CELL;
var snake,dir,nextDir,food,score,best=0,speedLvl,timer,DELAY,running=false,paused=false,dead=false;
try{best=parseInt(localStorage.getItem("gvp_snake_best"))||0}catch(e){}
bestEl.textContent=best;
var AC=null;
function snd(freq,dur,vol){try{if(!AC){var A=window.AudioContext||window.webkitAudioContext;if(!A)return;AC=new A()}if(AC.state==="suspended")AC.resume();var o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.value=freq;o.connect(g);g.connect(AC.destination);var t=AC.currentTime;g.gain.setValueAtTime(vol||0.05,t);g.gain.exponentialRampToValueAtTime(0.001,t+(dur||0.09));o.start(t);o.stop(t+(dur||0.09)+0.02)}catch(e){}}

function reset(){
  snake=[{x:11,y:11},{x:10,y:11},{x:9,y:11}];
  dir={x:1,y:0};nextDir={x:1,y:0};
  score=0;speedLvl=1;DELAY=140;dead=false;paused=false;
  placeFood();
  scoreEl.textContent=0;speedEl.textContent=1;
  overlay.classList.remove("show");
  pauseBtn.textContent="⏸ Pause";
  running=true;
  clearInterval(timer);
  timer=setInterval(step,DELAY);
  draw();
}
function placeFood(){
  var ok=false;
  while(!ok){
    food={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};
    ok=!snake.some(function(s){return s.x===food.x&&s.y===food.y});
  }
}
function step(){
  if(!running||paused||dead)return;
  dir=nextDir;
  var head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.y<0||head.x>=COLS||head.y>=ROWS||snake.some(function(s){return s.x===head.x&&s.y===head.y})){
    return gameOver();
  }
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score+=10;
    scoreEl.textContent=score;
    snd(740,0.07,0.05);
    placeFood();
    if(score%50===0&&speedLvl<8){
      speedLvl++;
      speedEl.textContent=speedLvl;
      DELAY=Math.max(60,DELAY-12);
      clearInterval(timer);
      timer=setInterval(step,DELAY);
    }
  }else{
    snake.pop();
  }
  draw();
}
function draw(){
  ctx.fillStyle="#0a0f1f";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle="rgba(255,255,255,.04)";
  for(var i=1;i<COLS;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,canvas.height);ctx.stroke();}
  for(var j=1;j<ROWS;j++){ctx.beginPath();ctx.moveTo(0,j*CELL);ctx.lineTo(canvas.width,j*CELL);ctx.stroke();}
  ctx.fillStyle="#ef4444";
  ctx.beginPath();
  ctx.arc(food.x*CELL+CELL/2,food.y*CELL+CELL/2,CELL/2-3,0,Math.PI*2);
  ctx.fill();
  for(var k=snake.length-1;k>=0;k--){
    var s=snake[k];
    var t=k/snake.length;
    ctx.fillStyle=k===0?"#a3e635":"rgba(34,197,94,"+(1-t*0.6)+")";
    roundRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2,4);
    ctx.fill();
  }
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function gameOver(){
  dead=true;running=false;
  clearInterval(timer);
  if(score>best){
    best=score;
    try{localStorage.setItem("gvp_snake_best",String(best))}catch(e){}
    bestEl.textContent=best;
    ovTitle.textContent="🏆 Notun Record!";
    ovMsg.textContent="Score: "+score+" — shundor khela!";
  }else{
    ovTitle.textContent="😿 Game Over";
    ovMsg.textContent="Score: "+score+" · Best: "+best;
  }
  overlay.classList.add("show");
}
function setDir(x,y){
  if(dir.x===-x&&dir.y===-y)return;
  nextDir={x:x,y:y};
}
document.addEventListener("keydown",function(e){
  var k=e.key;
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].indexOf(k)!==-1)e.preventDefault();
  if(k==="ArrowUp"||k==="w"||k==="W")setDir(0,-1);
  else if(k==="ArrowDown"||k==="s"||k==="S")setDir(0,1);
  else if(k==="ArrowLeft"||k==="a"||k==="A")setDir(-1,0);
  else if(k==="ArrowRight"||k==="d"||k==="D")setDir(1,0);
  else if(k===" "){togglePause();}
},{passive:false});
function togglePause(){
  if(dead)return;
  paused=!paused;
  pauseBtn.textContent=paused?"▶ Resume":"⏸ Pause";
}
pauseBtn.addEventListener("click",togglePause);
restartBtn.addEventListener("click",reset);
ovBtn.addEventListener("click",reset);
var sx=0,sy=0;
document.addEventListener("touchstart",function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.addEventListener("touchend",function(e){
  if(e.target!==canvas)return;
  var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)<20&&Math.abs(dy)<20){togglePause();return;}
  if(Math.abs(dx)>Math.abs(dy)){setDir(dx>0?1:-1,0);}else{setDir(0,dy>0?1:-1);}
},{passive:true});
reset();
})();
</script>
</body>
</html>
