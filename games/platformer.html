<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Platform Adventure</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#05070f;color:#eef2ff;font-family:"Segoe UI",system-ui,Arial,sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:8px}
.hud{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
.pill{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);padding:8px 16px;border-radius:999px;font-size:14px;font-weight:700}
.pill b{color:#22d3ee}
.btn{background:linear-gradient(135deg,#6d5dfc,#22d3ee);color:#071026;border:0;padding:9px 20px;border-radius:10px;font-weight:800;font-size:14px;cursor:pointer}
.btn.ghost{background:rgba(255,255,255,.08);color:#eef2ff;border:1px solid rgba(255,255,255,.15)}
canvas{border:1px solid rgba(255,255,255,.12);border-radius:12px;max-width:100%;height:auto;box-shadow:0 12px 34px rgba(0,0,0,.5)}
.hint{font-size:12px;color:#9aa7d0;text-align:center}
.overlay{position:fixed;inset:0;background:rgba(5,7,15,.9);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:20px;z-index:9}
.overlay.show{display:flex}
.overlay h2{font-size:30px}
.overlay p{color:#9aa7d0}
.ctl{display:flex;gap:10px}
.ctl .btn{min-width:56px;font-size:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div class="pill">Level: <b id="lvl">1</b>/3</div>
    <div class="pill">Coins: <b id="coins">0</b></div>
    <div class="pill">Best: <b id="best">L1</b></div>
    <button class="btn ghost" id="pauseBtn">⏸ Pause</button>
    <button class="btn" id="restartBtn">↻ Restart</button>
  </div>
  <canvas id="c"></canvas>
  <div class="hint">⬅➡ chalun, Space/⬆ jump · Coin shob tule flag porjonto pouchan!</div>
  <div class="ctl">
    <button class="btn ghost" id="lBtn">⬅</button>
    <button class="btn" id="jBtn">⤒ JUMP</button>
    <button class="btn ghost" id="rBtn">➡</button>
  </div>
</div>

<div class="overlay" id="ov">
  <h2 id="ovTitle">🎉 Shob Level Shesh!</h2>
  <p id="ovMsg"></p>
  <button class="btn" id="ovBtn">▶ Abar Kheln</button>
</div>

<script>
(function(){
"use strict";
var W=520,H=320;
var canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
var lvlEl=document.getElementById("lvl"),coinsEl=document.getElementById("coins"),bestEl=document.getElementById("best");
var ov=document.getElementById("ov"),ovTitle=document.getElementById("ovTitle"),ovMsg=document.getElementById("ovMsg");
var ovBtn=document.getElementById("ovBtn"),restartBtn=document.getElementById("restartBtn"),pauseBtn=document.getElementById("pauseBtn");
var lBtn=document.getElementById("lBtn"),rBtn=document.getElementById("rBtn"),jBtn=document.getElementById("jBtn");
var dpr=Math.min(window.devicePixelRatio||1,2);
canvas.width=W*dpr;canvas.height=H*dpr;
canvas.style.width="min(94vw,520px)";canvas.style.height="auto";
ctx.scale(dpr,dpr);
var GRAV=0.6,JUMP=-10.6,MOVE=3.2;
var LEVELS=[
  {spawn:{x:30,y:H-80},
   platforms:[{x:0,y:H-24,w:W,h:24},{x:200,y:H-90,w:90,h:16},{x:340,y:H-150,w:90,h:16},{x:180,y:H-210,w:70,h:16},{x:430,y:H-24,w:200,h:24}],
   coins:[{x:230,y:H-120},{x:260,y:H-120},{x:370,y:H-180},{x:400,y:H-180},{x:205,y:H-240}],
   enemies:[{x:230,y:H-44,w:26,left:200,right:290}],
   goal:{x:600,y:H-80}},
  {spawn:{x:30,y:H-80},
   platforms:[{x:0,y:H-24,w:150,h:24},{x:180,y:H-60,w:70,h:16},{x:280,y:H-110,w:70,h:16},{x:380,y:H-160,w:70,h:16},{x:480,y:H-210,w:70,h:16},{x:560,y:H-24,w:220,h:24}],
   coins:[{x:200,y:H-92},{x:300,y:H-142},{x:400,y:H-192},{x:500,y:H-242},{x:600,y:H-60}],
   enemies:[{x:600,y:H-44,w:26,left:560,right:700}],
   goal:{x:720,y:H-80}},
  {spawn:{x:30,y:H-80},
   platforms:[{x:0,y:H-24,w:120,h:24},{x:150,y:H-80,w:60,h:16},{x:240,y:H-130,w:60,h:16},{x:150,y:H-190,w:60,h:16},{x:250,y:H-250,w:60,h:16},{x:340,y:H-250,w:60,h:16},{x:430,y:H-190,w:60,h:16},{x:340,y:H-130,w:60,h:16},{x:440,y:H-80,w:60,h:16},{x:540,y:H-24,w:240,h:24}],
   coins:[{x:170,y:H-112},{x:260,y:H-162},{x:170,y:H-222},{x:270,y:H-282},{x:350,y:H-282},{x:450,y:H-222},{x:350,y:H-162},{x:460,y:H-112},{x:600,y:H-56},{x:640,y:H-56}],
   enemies:[{x:600,y:H-44,w:26,left:540,right:700},{x:440,y:H-100,w:26,left:430,right:490}],
   goal:{x:720,y:H-80}}
];
var player,cam,levelIdx,coinsGot,best=1,running=false,paused=false,over=false,frame=0,respawnFlash=0;
try{best=parseInt(localStorage.getItem("gvp_platform_best"))||1}catch(e){}
bestEl.textContent="L"+best;
var AC=null;
function snd(freq,dur,vol){try{if(!AC){var A=window.AudioContext||window.webkitAudioContext;if(!A)return;AC=new A()}if(AC.state==="suspended")AC.resume();var o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.value=freq;o.connect(g);g.connect(AC.destination);var t=AC.currentTime;g.gain.setValueAtTime(vol||0.045,t);g.gain.exponentialRampToValueAtTime(0.001,t+(dur||0.08));o.start(t);o.stop(t+(dur||0.08)+0.02)}catch(e){}}
function cloneLevel(idx){
  var L=LEVELS[idx];
  return {
    platforms:L.platforms.map(function(p){return {x:p.x,y:p.y,w:p.w,h:p.h};}),
    coins:L.coins.map(function(c){return {x:c.x,y:c.y,got:false};}),
    enemies:L.enemies.map(function(e){return {x:e.x,y:e.y,w:e.w,h:26,left:e.left,right:e.right,dir:1};}),
    goal:{x:L.goal.x,y:L.goal.y}
  };
}
function loadLevel(idx){
  levelIdx=idx;
  cam=0;coinsGot=0;frame=0;respawnFlash=0;
  player={x:LEVELS[idx].spawn.x,y:LEVELS[idx].spawn.y,w:22,h:30,vx:0,vy:0,onGround:false,dir:1};
  window.__lvl=cloneLevel(idx);
  lvlEl.textContent=idx+1;
  coinsEl.textContent=0;
}
function reset(){
  loadLevel(0);
  over=false;paused=false;
  ov.classList.remove("show");
  pauseBtn.textContent="⏸ Pause";
  running=true;
  draw();
}
function collide(ax,ay,aw,ah,b){return ax<b.x+b.w&&ax+aw>b.x&&ay<b.y+b.h&&ay+ah>b.y;}
function step(){
  if(!running||paused||over)return;
  frame++;
  if(respawnFlash>0)respawnFlash--;
  var L=window.__lvl,i;
  var kx=(keys.right?1:0)-(keys.left?1:0);
  player.vx=kx*MOVE;
  if(kx)player.dir=kx>0?1:-1;
  player.vy+=GRAV;
  player.x+=player.vx;
  for(i=0;i<L.platforms.length;i++){
    var p=L.platforms[i];
    if(collide(player.x,player.y,player.w,player.h,p)){
      if(player.vx>0)player.x=p.x-player.w;
      else if(player.vx<0)player.x=p.x+p.w;
    }
  }
  if(player.x<0)player.x=0;
  player.y+=player.vy;
  player.onGround=false;
  for(i=0;i<L.platforms.length;i++){
    var p2=L.platforms[i];
    if(collide(player.x,player.y,player.w,player.h,p2)){
      if(player.vy>0){player.y=p2.y-player.h;player.vy=0;player.onGround=true;}
      else if(player.vy<0){player.y=p2.y+p2.h;player.vy=0;}
    }
  }
  if(player.y>H+40){respawn();return;}
  for(i=0;i<L.coins.length;i++){
    var c=L.coins[i];
    if(!c.got&&collide(player.x,player.y,player.w,player.h,{x:c.x-7,y:c.y-7,w:14,h:14})){
      c.got=true;coinsGot++;coinsEl.textContent=coinsGot;snd(940,0.07,0.04);
    }
  }
  for(i=0;i<L.enemies.length;i++){
    var e=L.enemies[i];
    e.x+=e.dir*1.3;
    if(e.x<e.left){e.x=e.left;e.dir=1;}
    if(e.x+e.w>e.right){e.x=e.right-e.w;e.dir=-1;}
    if(respawnFlash<=0&&collide(player.x,player.y,player.w,player.h,e)){respawn();return;}
  }
  if(collide(player.x,player.y,player.w,player.h,{x:L.goal.x-10,y:L.goal.y,w:26,h:90})){
    snd(700,0.16,0.05);
    if(levelIdx+1<LEVELS.length){
      loadLevel(levelIdx+1);
      if(levelIdx+1>best){best=levelIdx+1;saveBest();}
    }else{
      if(3>best){best=3;saveBest();}
      running=false;over=true;
      ovTitle.textContent="🏆 Shob Level Shesh!";
      ovMsg.textContent="Coins (last level): "+coinsGot+" · Best: L"+best;
      ov.classList.add("show");
    }
  }
  if(player.x-player.w/2>cam)cam=player.x-player.w/2;
  if(cam>L.goal.x+80-W)cam=Math.max(0,L.goal.x+80-W);
}
function respawn(){
  respawnFlash=30;
  snd(150,0.25,0.06);
  player.x=LEVELS[levelIdx].spawn.x;
  player.y=LEVELS[levelIdx].spawn.y;
  player.vx=0;player.vy=0;
  cam=Math.max(0,player.x-W/2);
}
function saveBest(){try{localStorage.setItem("gvp_platform_best",String(best))}catch(e){}bestEl.textContent="L"+best;}
var keys={left:false,right:false};
function jump(){
  if(!running||paused||over)return;
  if(player.onGround){player.vy=JUMP;player.onGround=false;snd(560,0.08,0.04);}
}
function setKey(k,v){
  if(k==="left")keys.left=v;
  if(k==="right")keys.right=v;
  if(k==="jump"&&v)jump();
}
document.addEventListener("keydown",function(e){
  if(["ArrowLeft","ArrowRight","ArrowUp"," "].indexOf(e.key)!==-1)e.preventDefault();
  if(e.key==="ArrowLeft"||e.key==="a")setKey("left",true);
  if(e.key==="ArrowRight"||e.key==="d")setKey("right",true);
  if(e.key===" "||e.key==="ArrowUp"||e.key==="w")setKey("jump",true);
  if(e.key==="p"||e.key==="P"||e.key==="Escape")togglePause();
},{passive:false});
document.addEventListener("keyup",function(e){
  if(e.key==="ArrowLeft"||e.key==="a")setKey("left",false);
  if(e.key==="ArrowRight"||e.key==="d")setKey("right",false);
});
function hold(btn,k){
  var iv=null;
  function start(e){e.preventDefault();setKey(k,true);iv=setInterval(function(){setKey(k,true)},60);}
  function stop(){clearInterval(iv);iv=null;if(k!=="jump")setKey(k,false);}
  btn.addEventListener("touchstart",start,{passive:false});
  btn.addEventListener("mousedown",start);
  ["touchend","touchcancel","mouseup","mouseleave"].forEach(function(ev){btn.addEventListener(ev,stop)});
}
hold(lBtn,"left");
hold(rBtn,"right");
hold(jBtn,"jump");
function togglePause(){if(over||!running)return;paused=!paused;}
function drawPlayer(){
  var x=player.x-cam,y=player.y;
  ctx.fillStyle=respawnFlash>0&&frame%6<3?"#f59e0b":"#22d3ee";
  ctx.fillRect(x,y,player.w,player.h);
  ctx.fillStyle="#080B16";
  var ex=player.dir>0?x+player.w-9:x+4;
  ctx.fillRect(ex,y+6,5,5);
  ctx.fillStyle="#6d5dfc";
  ctx.fillRect(x+(player.dir>0?2:player.w-9),y+player.h-8,7,8);
}
function draw(){
  var big=ctx.createLinearGradient(0,0,0,H);
  big.addColorStop(0,"#0b1224");
  big.addColorStop(1,"#141e40");
  ctx.fillStyle=big;
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(255,255,255,.05)";
  var off=(cam*0.3)%160;
  for(var s=0;s<6;s++){
    ctx.beginPath();
    ctx.arc(s*160-off+60,60,34,0,Math.PI*2);
    ctx.arc(s*160-off+90,74,24,0,Math.PI*2);
    ctx.fill();
  }
  if(!window.__lvl)return;
  var L=window.__lvl,i;
  for(i=0;i<L.platforms.length;i++){
    var p=L.platforms[i];
    ctx.fillStyle="#1e293b";
    ctx.fillRect(p.x-cam,p.y,p.w,p.h);
    ctx.fillStyle="#22c55e";
    ctx.fillRect(p.x-cam,p.y,p.w,4);
  }
  for(i=0;i<L.coins.length;i++){
    var c=L.coins[i];
    if(c.got)continue;
    ctx.fillStyle="#fbbf24";
    ctx.beginPath();
    ctx.arc(c.x-cam,c.y,7,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle="#d97706";
    ctx.font="700 9px Segoe UI, Arial";
    ctx.textAlign="center";
    ctx.fillText("$",c.x-cam,c.y+3);
  }
  for(i=0;i<L.enemies.length;i++){
    var e=L.enemies[i];
    ctx.fillStyle="#ef4444";
    ctx.beginPath();
    ctx.arc(e.x-cam+e.w/2,e.y+e.h/2,e.w/2,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle="#080B16";
    ctx.fillRect(e.x-cam+6,e.y+7,5,5);
    ctx.fillRect(e.x-cam+e.w-11,e.y+7,5,5);
  }
  var gx=L.goal.x-cam;
  ctx.fillStyle="#9aa7d0";
  ctx.fillRect(gx,L.goal.y,5,90);
  ctx.fillStyle="#f472b6";
  ctx.beginPath();
  ctx.moveTo(gx+5,L.goal.y);
  ctx.lineTo(gx+5+34,L.goal.y+12);
  ctx.lineTo(gx+5,L.goal.y+24);
  ctx.closePath();
  ctx.fill();
  drawPlayer();
  ctx.fillStyle="rgba(238,242,255,.85)";
  ctx.font="700 12px Segoe UI, Arial";
  ctx.textAlign="left";
  ctx.fillText("Level "+(levelIdx+1)+" · Coins: "+coinsGot,12,22);
  if(paused){
    ctx.fillStyle="rgba(5,7,15,.6)";
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#eef2ff";ctx.font="800 24px Segoe UI, Arial";ctx.textAlign="center";
    ctx.fillText("⏸ PAUSED",W/2,H/2-6);
    ctx.font="600 13px Segoe UI, Arial";ctx.fillStyle="#9aa7d0";
    ctx.fillText("P diye continue koro",W/2,H/2+22);
  }
}
function loop(){step();draw();requestAnimationFrame(loop);}
document.addEventListener("visibilitychange",function(){if(document.hidden&&running&&!over)paused=true;});
restartBtn.addEventListener("click",reset);
ovBtn.addEventListener("click",reset);
pauseBtn.addEventListener("click",togglePause);
reset();
loop();
})();
</script>
</body>
</html>
