<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Racing Challenge</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#05070f;color:#eef2ff;font-family:"Segoe UI",system-ui,Arial,sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:8px}
.hud{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
.pill{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);padding:8px 16px;border-radius:999px;font-size:14px;font-weight:700}
.pill b{color:#22d3ee}
.btn{background:linear-gradient(135deg,#6d5dfc,#22d3ee);color:#071026;border:0;padding:9px 20px;border-radius:10px;font-weight:800;font-size:14px;cursor:pointer}
.btn.ghost{background:rgba(255,255,255,.08);color:#eef2ff;border:1px solid rgba(255,255,255,.15)}
canvas{border:1px solid rgba(255,255,255,.12);border-radius:12px;max-width:100%;height:auto;box-shadow:0 12px 34px rgba(0,0,0,.5)}
.hint{font-size:12px;color:#9aa7d0;text-align:center}
.overlay{position:fixed;inset:0;background:rgba(5,7,15,.9);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:20px;z-index:9}
.overlay.show{display:flex}
.overlay h2{font-size:30px}
.overlay p{color:#9aa7d0}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div class="pill">Score: <b id="score">0</b></div>
    <div class="pill">Best: <b id="best">0</b></div>
    <div class="pill">Speed: <b id="spd">1x</b></div>
    <div class="pill">Lives: <b id="lives">❤❤❤</b></div>
    <button class="btn ghost" id="pauseBtn">⏸ Pause</button>
    <button class="btn" id="restartBtn">↻ Restart</button>
  </div>
  <canvas id="c"></canvas>
  <div class="hint">⬅➡ lane bodlan · Mobile-e niche-r button / swipe korun</div>
  <div style="display:flex;gap:20px">
    <button class="btn ghost" id="leftBtn" style="font-size:22px;padding:10px 30px">⬅</button>
    <button class="btn ghost" id="rightBtn" style="font-size:22px;padding:10px 30px">➡</button>
  </div>
</div>

<div class="overlay" id="ov">
  <h2 id="ovTitle">😿 Crash!</h2>
  <p id="ovMsg"></p>
  <button class="btn" id="ovBtn">▶ Abar Kheln</button>
</div>

<script>
(function(){
"use strict";
var W=380,H=520;
var canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
var scoreEl=document.getElementById("score"),bestEl=document.getElementById("best"),spdEl=document.getElementById("spd"),livesEl=document.getElementById("lives");
var ov=document.getElementById("ov"),ovTitle=document.getElementById("ovTitle"),ovMsg=document.getElementById("ovMsg");
var ovBtn=document.getElementById("ovBtn"),restartBtn=document.getElementById("restartBtn"),pauseBtn=document.getElementById("pauseBtn");
var leftBtn=document.getElementById("leftBtn"),rightBtn=document.getElementById("rightBtn");
var dpr=Math.min(window.devicePixelRatio||1,2);
canvas.width=W*dpr;canvas.height=H*dpr;
canvas.style.width="min(80vw,340px)";canvas.style.height="auto";
ctx.scale(dpr,dpr);
var ROAD_L=40,ROAD_R=W-40,LANES=3,LANE_W=(ROAD_R-ROAD_L)/LANES;
var player,cars,score,best=0,lives,speed,running=false,paused=false,over=false,frame=0,spawnT=0,stripe=0;
try{best=parseInt(localStorage.getItem("gvp_racing_best"))||0}catch(e){}
bestEl.textContent=best;
var AC=null;
function snd(freq,dur,vol){try{if(!AC){var A=window.AudioContext||window.webkitAudioContext;if(!A)return;AC=new A()}if(AC.state==="suspended")AC.resume();var o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.value=freq;o.connect(g);g.connect(AC.destination);var t=AC.currentTime;g.gain.setValueAtTime(vol||0.045,t);g.gain.exponentialRampToValueAtTime(0.001,t+(dur||0.08));o.start(t);o.stop(t+(dur||0.08)+0.02)}catch(e){}}
function laneX(l){return ROAD_L+LANE_W*l+LANE_W/2;}
function reset(){
  player={lane:1,x:laneX(1)-16,y:H-94,w:32,h:58,targetX:laneX(1)-16};
  cars=[];score=0;lives=3;speed=3;frame=0;spawnT=50;stripe=0;over=false;paused=false;
  scoreEl.textContent=0;spdEl.textContent="1x";livesEl.textContent="❤❤❤";
  ov.classList.remove("show");
  pauseBtn.textContent="⏸ Pause";
  running=true;
  draw();
}
function move(dir){
  if(!running||paused||over)return;
  var nl=player.lane+dir;
  if(nl<0||nl>=LANES)return;
  player.lane=nl;
  player.targetX=laneX(nl)-16;
  snd(420,0.05,0.03);
}
function step(){
  if(!running||paused||over)return;
  frame++;
  if(frame%280===0&&speed<9.5){speed+=0.6;spdEl.textContent=(speed/3).toFixed(1).replace(".0","")+"x";}
  stripe=(stripe+speed)%36;
  score+=Math.round(speed*0.35);
  scoreEl.textContent=score;
  player.x+=(player.targetX-player.x)*0.22;
  if(player.x<0)player.x=0;
  if(spawnT<=0){
    var free=[];
    for(var l=0;l<LANES;l++)free.push(l);
    for(var i=0;i<cars.length;i++)if(cars[i].y<100)free=free.filter(function(x){return x!==cars[i].lane;});
    var spawnCount=Math.random()<0.25&&free.length>1?2:1;
    for(var s=0;s<spawnCount&&free.length;s++){
      var idx=Math.floor(Math.random()*free.length);
      var lane=free.splice(idx,1)[0];
      var cols=["#ef4444","#f59e0b","#22c55e","#a855f7","#64748b"];
      cars.push({lane:lane,x:laneX(lane)-16,y:-70,w:32,h:54,color:cols[Math.floor(Math.random()*cols.length)],vy:0.6+Math.random()*0.8});
    }
    spawnT=Math.max(34,72-Math.floor(speed*4))+Math.floor(Math.random()*30);
  }
  spawnT--;
  for(var j=cars.length-1;j>=0;j--){
    var c=cars[j];
    c.y+=(speed+c.vy);
    if(c.y>H+40){cars.splice(j,1);score+=5;scoreEl.textContent=score;continue;}
    if(player.x<c.x+c.w-6&&player.x+player.w>c.x+6&&player.y<c.y+c.h-6&&player.y+player.h>c.y+6){
      cars.splice(j,1);
      lives--;
      livesEl.textContent=lives>0?"❤".repeat(lives):"—";
      snd(120,0.3,0.07);
      if(lives<=0){
        over=true;running=false;
        ovTitle.textContent=score>=best?"🏆 Notun Record!":"💥 Crash!";
        ovMsg.textContent="Score: "+score+" · Best: "+best;
        ov.classList.add("show");
        return;
      }else{
        player.y=H-94;
      }
    }
  }
  if(score>best){
    best=score;
    try{localStorage.setItem("gvp_racing_best",String(best))}catch(e){}
    bestEl.textContent=best;
  }
}
function drawCar(x,y,w,h,color,isPlayer){
  ctx.fillStyle=color;
  roundRect(x,y,w,h,8);
  ctx.fill();
  ctx.fillStyle="rgba(8,11,22,.55)";
  roundRect(x+5,y+9,w-10,h*0.34,5);
  ctx.fill();
  if(isPlayer){
    ctx.fillStyle="rgba(238,242,255,.9)";
    ctx.fillRect(x+4,y+4,7,5);
    ctx.fillRect(x+w-11,y+4,7,5);
  }
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function draw(){
  ctx.fillStyle="#0a0f1f";
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#151b30";
  ctx.fillRect(ROAD_L,0,ROAD_R-ROAD_L,H);
  ctx.strokeStyle="rgba(255,255,255,.25)";
  ctx.setLineDash([22,16]);
  ctx.lineDashOffset=-stripe;
  ctx.lineWidth=3;
  for(var l=1;l<LANES;l++){
    var x=ROAD_L+LANE_W*l;
    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,H);
    ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.strokeStyle="rgba(34,211,238,.4)";
  ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(ROAD_L,0);ctx.lineTo(ROAD_L,H);ctx.stroke();
  ctx.beginPath();ctx.moveTo(ROAD_R,0);ctx.lineTo(ROAD_R,H);ctx.stroke();
  var i;
  for(i=0;i<cars.length;i++)drawCar(cars[i].x,cars[i].y,cars[i].w,cars[i].h,cars[i].color,false);
  if(!over)drawCar(player.x,player.y,player.w,player.h,"#22d3ee",true);
  if(paused){
    ctx.fillStyle="rgba(5,7,15,.6)";
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#eef2ff";ctx.font="800 24px Segoe UI, Arial";ctx.textAlign="center";
    ctx.fillText("⏸ PAUSED",W/2,H/2-6);
    ctx.font="600 13px Segoe UI, Arial";ctx.fillStyle="#9aa7d0";
    ctx.fillText("P diye continue koro",W/2,H/2+22);
  }
}
function loop(){step();draw();requestAnimationFrame(loop);}
function togglePause(){if(over||!running)return;paused=!paused;}
document.addEventListener("keydown",function(e){
  if(["ArrowLeft","ArrowRight"].indexOf(e.key)!==-1)e.preventDefault();
  if(e.key==="ArrowLeft"||e.key==="a")move(-1);
  if(e.key==="ArrowRight"||e.key==="d")move(1);
  if(e.key==="p"||e.key==="P"||e.key==="Escape")togglePause();
},{passive:false});
leftBtn.addEventListener("click",function(){move(-1)});
rightBtn.addEventListener("click",function(){move(1)});
var sx=0;
document.addEventListener("touchstart",function(e){sx=e.touches[0].clientX},{passive:true});
document.addEventListener("touchend",function(e){
  var dx=e.changedTouches[0].clientX-sx;
  if(Math.abs(dx)<24)return;
  move(dx>0?1:-1);
},{passive:true});
document.addEventListener("visibilitychange",function(){if(document.hidden&&running&&!over)paused=true;});
restartBtn.addEventListener("click",reset);
ovBtn.addEventListener("click",reset);
pauseBtn.addEventListener("click",togglePause);
reset();
loop();
})();
</script>
</body>
</html>
