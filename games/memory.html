<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;background:#05070f;color:#eef2ff;font-family:"Segoe UI",system-ui,Arial,sans-serif}
.wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:14px}
.hud{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pill{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);padding:7px 15px;border-radius:999px;font-size:13px;font-weight:700}
.pill b{color:#22d3ee}
.diff{display:flex;gap:8px}
.d-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);color:#9aa7d0;padding:8px 16px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer}
.d-btn.active{background:linear-gradient(135deg,#6d5dfc,#22d3ee);color:#071026;border-color:transparent}
.board{display:grid;gap:10px;width:100%;max-width:560px;margin:0 auto}
.card{aspect-ratio:1;position:relative;perspective:600px;cursor:pointer}
.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .45s}
.card.flipped .inner,.card.matched .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:grid;place-items:center;border-radius:14px;font-size:clamp(26px,7vw,42px);backface-visibility:hidden}
.front{background:linear-gradient(135deg,#1c2752,#111834);border:1px solid rgba(255,255,255,.12);color:transparent}
.front::after{content:"?";font-size:clamp(20px,5vw,30px);color:#6d5dfc;font-weight:800}
.back{background:#161f42;border:1px solid rgba(255,255,255,.2);transform:rotateY(180deg)}
.card.matched .back{background:rgba(34,197,94,.2);border-color:#22c55e}
.btn{background:linear-gradient(135deg,#6d5dfc,#22d3ee);color:#071026;border:0;padding:10px 22px;border-radius:10px;font-weight:800;font-size:14px;cursor:pointer}
.overlay{position:fixed;inset:0;background:rgba(5,7,15,.9);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:20px;z-index:9}
.overlay.show{display:flex}
.overlay h2{font-size:30px}
.overlay p{color:#9aa7d0}
</style>
</head>
<body>
<div class="wrap">
  <div class="diff">
    <button class="d-btn active" data-n="6">😊 Easy (6)</button>
    <button class="d-btn" data-n="8">🙂 Medium (8)</button>
    <button class="d-btn" data-n="12">😎 Hard (12)</button>
  </div>
  <div class="hud">
    <div class="pill">Moves: <b id="moves">0</b></div>
    <div class="pill">Pairs: <b id="pairs">0</b>/<span id="total">6</span></div>
    <div class="pill">Time: <b id="time">0s</b></div>
    <div class="pill">Best: <b id="best">—</b></div>
  </div>
  <div class="board" id="board"></div>
  <button class="btn" id="restartBtn">↻ Notun Khel</button>
</div>

<div class="overlay" id="ov">
  <h2>🎉 Shundor!</h2>
  <p id="ovMsg"></p>
  <button class="btn" id="ovBtn">▶ Abar Kheln</button>
</div>

<script>
(function(){
"use strict";
var EMOJIS=["🐶","🐱","🦊","🐼","🦁","🐸","🐵","🦄","🐙","🦋","🍉","🍓","🚀","⚽","🎈","🎁","🌈","🔥","⭐","🍕"];
var boardEl=document.getElementById("board"),movesEl=document.getElementById("moves"),pairsEl=document.getElementById("pairs");
var totalEl=document.getElementById("total"),timeEl=document.getElementById("time"),bestEl=document.getElementById("best");
var restartBtn=document.getElementById("restartBtn"),ov=document.getElementById("ov"),ovMsg=document.getElementById("ovMsg"),ovBtn=document.getElementById("ovBtn");
var pairsCount=6,deck=[],first=null,lock=false,matched=0,moves=0,secs=0,timer=null,best=null;
var bestKey="gvp_memory_best_";
function loadBest(){
  try{best=parseInt(localStorage.getItem(bestKey+pairsCount))||null}catch(e){best=null}
  bestEl.textContent=best?best+"s":"—";
}
function shuffle(a){
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}
function newGame(){
  clearInterval(timer);timer=null;
  first=null;lock=false;matched=0;moves=0;secs=0;
  movesEl.textContent="0";timeEl.textContent="0s";
  ov.classList.remove("show");
  loadBest();
  var picks=shuffle(EMOJIS.slice()).slice(0,pairsCount);
  deck=shuffle(picks.concat(picks));
  totalEl.textContent=pairsCount;
  pairsEl.textContent="0";
  var cols=pairsCount<=6?3:(pairsCount<=8?4:4);
  boardEl.style.gridTemplateColumns="repeat("+cols+",1fr)";
  boardEl.innerHTML=deck.map(function(e,i){
    return '<div class="card" data-i="'+i+'"><div class="inner">'+
      '<div class="face front"></div><div class="face back">'+e+'</div>'+
      '</div></div>';
  }).join("");
  timer=setInterval(tick,1000);
}
function tick(){
  secs++;
  timeEl.textContent=secs+"s";
}
boardEl.addEventListener("click",function(e){
  var card=e.target.closest(".card");
  if(!card||lock)return;
  if(card.classList.contains("matched")||card.classList.contains("flipped"))return;
  card.classList.add("flipped");
  if(!first){
    first=card;
    return;
  }
  moves++;
  movesEl.textContent=moves;
  var a=first,b=card;
  first=null;
  if(deck[parseInt(a.dataset.i,10)]===deck[parseInt(b.dataset.i,10)]){
    a.classList.add("matched");b.classList.add("matched");
    matched++;
    pairsEl.textContent=matched;
    if(matched===pairsCount)win();
  }else{
    lock=true;
    setTimeout(function(){
      a.classList.remove("flipped");b.classList.remove("flipped");
      lock=false;
    },750);
  }
});
function win(){
  clearInterval(timer);
  var msg="Moves: "+moves+" · Time: "+secs+"s";
  if(!best||secs<best){
    best=secs;
    try{localStorage.setItem(bestKey+pairsCount,String(secs))}catch(e){}
    msg+=" — 🏆 Notun Best!";
  }
  ovMsg.textContent=msg;
  setTimeout(function(){ov.classList.add("show")},400);
}
restartBtn.addEventListener("click",newGame);
ovBtn.addEventListener("click",newGame);
document.querySelectorAll(".d-btn").forEach(function(b){
  b.addEventListener("click",function(){
    document.querySelectorAll(".d-btn").forEach(function(x){x.classList.remove("active")});
    b.classList.add("active");
    pairsCount=parseInt(b.dataset.n,10);
    newGame();
  });
});
newGame();
})();
</script>
</body>
</html>
